name: Migrer les données Ludodio vers Cloudflare (copie vérifiée)
on:
  push:
    branches: [main]
    paths: [.github/workflows/ludodio-copy-to-cloudflare.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ludodio-migration-copy
  cancel-in-progress: false
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer Wrangler et Python
        run: |
          npm install --global wrangler@4
          python3 -m pip install --quiet requests
      - name: Récupérer le code de migration Ludodio (sans le fusionner)
        run: |
          git clone --depth 1 --branch feat/ludodio-cloudflare-pin-simple-20261113 \
            https://github.com/ludodulac/La-foret-enchantee.git ludodio
      - name: Exporter intégralement les contenus publics Supabase (lecture seulement)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,subprocess,requests
          source=requests.get('https://raw.githubusercontent.com/ludodulac/La-foret-enchantee/main/js/supabase.js',timeout=30)
          source.raise_for_status()
          match=re.search(r"SUPABASE_ANON_KEY\s*=\s*'([^']+)'",source.text)
          if not match:raise SystemExit("Clé publique Supabase introuvable, aucun transfert")
          subprocess.run(['python3','ludodio/scripts/ludodio_migrate_public.py','--output','/tmp/ludodio-export',
                          '--anon-source',match.group(1)],check=True)
          PY
      - name: Importer D1/R2 et vérifier chaque fichier sans toucher au site public
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EJ_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.EJ_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 ludodio/scripts/ludodio_apply_cloudflare.py /tmp/ludodio-export
