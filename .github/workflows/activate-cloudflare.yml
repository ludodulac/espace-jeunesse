name: Activer Cloudflare indépendant — Espace Jeunesse

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: espace-jeunesse-cloudflare-activation
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer uniquement Espace Jeunesse
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Créer les nouvelles ressources et activer l'administration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EJ_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EJ_CLOUDFLARE_ACCOUNT_ID }}
          EJ_ADMIN_PASSWORD: ${{ secrets.EJ_ADMIN_PASSWORD }}
        run: node scripts/deploy-cloudflare.mjs
