name: Vérifier Espace Jeunesse
on:
  push:
    branches: [main, feat/site-pages-simple-v1]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/smoke.mjs
