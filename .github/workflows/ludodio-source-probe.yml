name: Diagnostiquer la disponibilité des fichiers Ludodio
on:
  push:
    branches: [main]
    paths: [.github/workflows/ludodio-source-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tester sans clé secrète les trois buckets publics Supabase
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          prefix='https://jwyayfkssyagvnablttg.supabase.co/storage/v1/object/public'
          entries={
            'audio':'audios/1789293684636-bb996eac-75b5-40ad-829e-033a474360bb-les-musiciens-de-breme.m4a',
            'image':'images/1789297701700-69f88861-db31-4473-9ed4-6f13d5e785f2-les-musiciens-de-breme.webp',
            'blog':'blog-images/covers/1782111993541-les-questions-des-enfants.jpg'
          }
          for label,path in entries.items():
              request=urllib.request.Request(prefix+'/'+path,method='GET')
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      print(label,response.status,response.headers.get('Content-Type'),len(response.read(64)))
              except urllib.error.HTTPError as error:
                  print(label,error.code,error.read(300).decode(errors='replace'))
          PY
