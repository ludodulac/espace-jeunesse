name: Importer les couvertures de la boutique
on:
  push:
    paths:
      - scripts/import_shop_covers.py
      - .github/workflows/import-shop-covers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/import_shop_covers.py
      - name: Enregistrer les couvertures vérifiées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/couvertures/
          if ! git diff --cached --quiet; then
            git commit -m "Boutique : ajouter les couvertures vérifiées en local"
            git push
          fi
